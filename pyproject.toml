[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digue"
dynamic = ["version"]
description = "Local speech-to-text dictation and transcription using whisper.cpp"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Álvaro Justen", email = "alvarojusten@gmail.com" },
]
keywords = ["whisper", "dictation", "speech-to-text", "transcription", "stt", "cli", "docker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/turicas/digue"
Repository = "https://github.com/turicas/digue"
Issues = "https://github.com/turicas/digue/issues"

[project.scripts]
digue = "digue.cli:main"

[tool.setuptools]
packages = ["digue"]

[tool.setuptools.dynamic]
version = { attr = "digue.__version__" }

[dependency-groups]
dev = [
    "build>=1",
    "coverage>=7",
    "mypy>=1.15",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.11",
    "twine>=6",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "SIM", "C4", "A"]
ignore = ["E203", "E231", "E501", "E701"]

[tool.ruff.lint.isort]
split-on-trailing-comma = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["digue", "benchmark_models.py"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["digue"]

[tool.coverage.report]
show_missing = true
